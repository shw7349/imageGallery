[project]
name = "gallery-backend"
version = "0.1.0"
description = "고해상도 사진 갤러리 백엔드 API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "boto3>=1.44.3",
    "fastapi>=0.163.1",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-json-logger>=4.2.0",
    "pyvips>=3.2.0",
    "rawpy>=0.28.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.44.3",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pyvips-binary>=8.18.7 ; sys_platform == 'darwin'",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["docs/archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 테스트에서는 assert 사용이 정상이다.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# 타입 스텁이 없는 라이브러리
module = ["pyvips.*", "rawpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
